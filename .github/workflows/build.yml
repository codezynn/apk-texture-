name: Build CODM Flat App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Find APK
        run: |
          echo "=== looking for apk ==="
          find . -name "*.apk" -type f 2>/dev/null || echo "none found"
          echo "=== app/build tree ==="
          find app/build -type d 2>/dev/null | head -20 || echo "no app/build"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codm-flat-app
          path: |
            app/build/outputs/apk/**/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
