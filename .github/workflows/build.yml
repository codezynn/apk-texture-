name: Build CODM Flat App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Show project structure
        run: |
          echo "=== files ==="
          find . -name "*.gradle" -o -name "settings.gradle" | head -20
          echo "=== settings ==="
          cat settings.gradle
          echo "=== root build ==="
          cat build.gradle
          echo "=== app build ==="
          cat app/build.gradle

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --info | head -100

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: codm-flat-app
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
